name: CI

# Runs on PRs (incl. forks; read-only token, no secrets) and on pushes to main.
# This job is the required status check enforced by the `main` ruleset; its job
# id (`ci`) is what the ruleset's required_status_checks context must match.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to a full commit SHA; the comment tracks the version and
      # Dependabot bumps both together. ubuntu-latest ships Python 3.10+.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python version
        run: python3 --version

      - name: Skill guardrails (size, front matter, reference structure, citations, links)
        run: python3 tests/check_skill.py

      # Pinned so a new markdownlint release cannot fail this required check
      # without a deliberate bump; disabled rules carry their reason in
      # .markdownlint-cli2.jsonc.
      - name: Markdown lint (markdownlint-cli2)
        run: npx --yes markdownlint-cli2@0.18.1

      - name: Script compiles
        run: python3 -m py_compile scripts/rgs_lookup.py

      - name: Unit tests (lookup script, generated workbook fixture)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Lookup script smoke tests (seed dataset, no network)
        run: |
          python3 scripts/rgs_lookup.py --validate WBedKanKoa
          python3 scripts/rgs_lookup.py --lookup BLimBanRba
          python3 scripts/rgs_lookup.py --search kas --nivo 4
          if python3 scripts/rgs_lookup.py --validate BNopeNope; then
            echo "::error::validator accepted a non-existent code"; exit 1
          fi
          echo "smoke tests passed"
